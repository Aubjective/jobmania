name: Update Certain and Afterimage mechanics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-certain-afterimage.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mechanic data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp = Path('data/mechanics.json')
          data = json.loads(mp.read_text())
          defs = data.setdefault('effectDefinitions', {})

          defs['Certain'] = {
            'skillUnit': 'ApplyOn',
            'effect': 'Certain',
            'termKey': 'mechanic.certain',
            'mechanicConfirmed': True,
            'confirmationSource': 'live+sheet+localisation',
            'clickable': True,
            'templateKey': 'certain',
            'duration': 'OneAction',
            'cleansesOrIgnores': ['Slack','Confuse','Injury','Blind','Dizzy','Depress','Reflux'],
            'boostPercent': 20,
            'affectedValues': ['attack','healing','protect'],
            'consumeStacksOnTrigger': 1,
            'endOfTurnPassivesConsume': True
          }

          defs['Afterimage'] = {
            'skillUnit': 'ApplyOn',
            'effect': 'Afterimage',
            'termKey': 'mechanic.afterimage',
            'mechanicConfirmed': True,
            'confirmationSource': 'live+sheet+localisation',
            'clickable': True,
            'templateKey': 'afterimage',
            'extraUsesPerStack': 1,
            'targets': ['NextOriginallyZeroAPAbilityInHand','OverloadedAbility'],
            'excludesEffects': ['DiscardAbilityEffect','RecoverAbilityEffect'],
            'consumedOnActivation': True,
            'enemyMonsterBehavior': 'NextAbilityUsedXAdditionalTimes'
          }

          data['version'] = max(int(data.get('version', 0)), 27)
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lp = Path('data/mechanics_localisation.json')
          loc = json.loads(lp.read_text())
          locales = loc.setdefault('locales', {})
          additions = {
            'en': {
              'terms': {
                'mechanic.certain': 'Certain',
                'mechanic.afterimage': 'Afterimage'
              },
              'templates': {
                'certain': 'For one action, user can learn the following Slack, Confuse, Injury, Blind, Dizzy, Depress, Reflux and get a 20% boost on attack, healing and protect gain. (Remove 1 stack on trigger. [End-of-Turn] passives will also consume this buff)',
                'afterimage': 'Increase the number of uses of the next originally 0 AP cost ability on hand or Overloaded ability by X times. (X is the number of stacks. Excluding discard and recover ability effect. Consumed on activation. Enemy monster will use any of its next ability X more times)'
              }
            }
          }
          for locale, payload in additions.items():
              target = locales.setdefault(locale, {})
              target.setdefault('terms', {}).update(payload['terms'])
              target.setdefault('templates', {}).update(payload['templates'])
          loc['version'] = max(int(loc.get('version', 0)), 25)
          lp.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json
          git diff --cached --quiet || git commit -m 'Add confirmed Certain and Afterimage mechanics'
          git push
