name: Update Chronocharge mechanic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-chronocharge.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mechanic data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp = Path('data/mechanics.json')
          data = json.loads(mp.read_text())
          defs = data.setdefault('effectDefinitions', {})
          defs['Chronocharge'] = {
            'skillUnit': 'ApplyOn',
            'effect': 'Chronocharge',
            'termKey': 'mechanic.chronocharge',
            'mechanicConfirmed': True,
            'confirmationSource': 'live+sheet+localisation',
            'clickable': True,
            'templateKey': 'chronocharge',
            'templateArgs': {
              'percent': 'boostPercentPerTurn',
              'max': 'maxStacks',
              'upgradeMax': 'upgradeMaxStacks'
            },
            'boostPercentPerTurn': 15,
            'scalesWith': 'TurnsPassed',
            'affects': ['damage', 'heal'],
            'maxStacks': 4,
            'upgradeMaxStacks': 6
          }
          data['version'] = max(int(data.get('version', 0)), 26)
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lp = Path('data/mechanics_localisation.json')
          loc = json.loads(lp.read_text())
          locales = loc.setdefault('locales', {})
          additions = {
            'en': {
              'terms': {'mechanic.chronocharge': 'Chronocharge'},
              'templates': {'chronocharge': 'The damage and healing of this skill is increased by {percent}% for every turn that has passed. (Max {max}/upgrade {upgradeMax} stacks)'}
            },
            'zh-CN': {
              'terms': {'mechanic.chronocharge': '时能蓄力'},
              'templates': {'chronocharge': '每经过1回合，此技能的伤害和恢复提高{percent}%。（最多{max}层/升级后{upgradeMax}层）'}
            },
            'zh-TW': {
              'terms': {'mechanic.chronocharge': '時能蓄力'},
              'templates': {'chronocharge': '每經過1回合，此技能的傷害和恢復提高{percent}%。（最多{max}層/升級後{upgradeMax}層）'}
            }
          }
          for locale, payload in additions.items():
              target = locales.setdefault(locale, {})
              target.setdefault('terms', {}).update(payload['terms'])
              target.setdefault('templates', {}).update(payload['templates'])
          loc['version'] = max(int(loc.get('version', 0)), 24)
          lp.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json
          git diff --cached --quiet || git commit -m 'Add confirmed Chronocharge mechanic'
          git push
