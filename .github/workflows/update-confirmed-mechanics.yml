name: Update confirmed mechanics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-confirmed-mechanics.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update mechanics data and localisation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mechanics_path = Path('data/mechanics.json')
          loc_path = Path('data/mechanics_localisation.json')

          mechanics = json.loads(mechanics_path.read_text(encoding='utf-8'))
          mechanics['version'] = max(int(mechanics.get('version', 0)), 20)
          defs = mechanics.setdefault('effectDefinitions', {})

          defs.update({
            'Injury': {
              'skillUnit': 'Debuff',
              'effect': 'Injury',
              'termKey': 'mechanic.injury',
              'localisationKey': 'InjuryXDescr',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+sheet+localisation',
              'clickable': True,
              'templateKey': 'injury',
              'templateArgs': {
                'percent': 'attackDamageReductionPercentPerStack',
                'max': 'maxStacks',
                'upgradeMax': 'upgradeMaxStacks'
              },
              'attackDamageReductionPercentPerStack': 3,
              'maxStacks': 8,
              'upgradeMaxStacks': 15,
              'stackReductionAt': 'TurnEnd',
              'stackReduction': 'half'
            },
            'Tenacity': {
              'skillUnit': 'Protect',
              'effect': 'Delay',
              'termKey': 'mechanic.tenacity',
              'localisationKey': 'TenacityDescr',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+sheet+localisation',
              'clickable': True,
              'templateKey': 'tenacity',
              'dotDamageMultiplier': 0.5,
              'dotDamageReductionPercent': 50,
              'affectedDotEffects': ['Burn', 'Bleed', 'Venom', 'Restrain', 'Insane']
            },
            'Charge Master': {
              'skillUnit': 'Upgrade',
              'effect': 'Charge',
              'termKey': 'mechanic.chargeMaster',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+sheet',
              'clickable': True,
              'templateKey': 'chargeMaster',
              'upgrades': ['Charge', 'Stack Charge']
            },
            'After Action Passive': {
              'family': 'System Rule',
              'termKey': 'mechanic.afterActionPassive',
              'localisationKey': 'AfterActionPassive',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+localisation',
              'clickable': True,
              'templateKey': 'afterActionPassive',
              'resolutionOrder': ['AfterActionDamage', 'AfterActionHeal', 'AfterActionBuff', 'AfterActionDebuff'],
              'buffsAndDebuffsResolveAfterDamageAndHeal': True
            },
            'Thunder Sigil': {
              'family': 'Element Sigil',
              'familyElement': 'Thunder',
              'skillUnit': 'Mark',
              'effect': 'Thunder',
              'termKey': 'mechanic.thunderSigil',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+sheet',
              'clickable': True,
              'templateKey': 'thunderSigil',
              'maxStacks': 10,
              'upgradeMaxStacks': 10,
              'status': 'Paralysis',
              'immunityBypassChancePercentPerStack': 3,
              'triggerElement': 'Thunder',
              'triggerElementSources': ['AbilityElement', 'CharacterElementStack'],
              'damagePercentPerStack': 5,
              'damageBasedOn': 'OpponentStrongestAttribute',
              'removedAt': 'TurnEnd'
            },
            'Elemental Burst': {
              'family': 'Apply Tag',
              'applyTag': True,
              'skillUnit': 'ApplyOn',
              'effect': 'Element',
              'termKey': 'mechanic.elementalBurst',
              'localisationKey': 'ElementalBurst',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+sheet+localisation',
              'clickable': True,
              'templateKey': 'elementalBurst',
              'triggerAt': 'AttackEffect',
              'requiresAttackElementMatchesOpponentElementalVulnerable': True,
              'removeMatchingElementalVulnerable': True,
              'bonusDamagePercentPerRemovedStack': 5
            }
          })

          mechanics_path.write_text(json.dumps(mechanics, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          loc = json.loads(loc_path.read_text(encoding='utf-8'))
          loc['version'] = max(int(loc.get('version', 0)), 18)
          locales = loc.setdefault('locales', {})

          additions = {
            'en': {
              'terms': {
                'mechanic.injury': 'Injury',
                'mechanic.tenacity': 'Tenacity',
                'mechanic.chargeMaster': 'Charge Master',
                'mechanic.afterActionPassive': 'After Action Passive',
                'mechanic.thunderSigil': 'Thunder Sigil',
                'mechanic.elementalBurst': 'Elemental Burst'
              },
              'names': {
                'Injury': 'Injury',
                'Tenacity': 'Tenacity',
                'Charge Master': 'Charge Master',
                'After Action Passive': 'After Action Passive',
                'Thunder Sigil': 'Thunder Sigil',
                'Elemental Burst': 'Elemental Burst'
              },
              'templates': {
                'injury': 'Deal {percent}% less attack damage for each stack. (Max {max}/upgrade {upgradeMax} stacks. Lose half of the stacks at the end of turn)',
                'tenacity': 'Take half damage from the following DoT effects: Burn, Bleed, Venom, Restrain and Insane.',
                'chargeMaster': 'Upgrade Charge and Stack Charge skills.',
                'afterActionPassive': 'After-action buffs and debuffs will always execute after after-action damage and heal.',
                'thunderSigil': "For each stack, Paralysis debuffs have a 3% chance to bypass your Paralysis immunity. Additionally, whenever an ability with the Thunder element is used (either from the ability itself or the character's element stack), you suffer 5% damage per sigil stack, based on the opponent's strongest attribute. (Max 10 stacks. Removed at the end of the turn.)",
                'elementalBurst': "When the element of the attack matches the opponent's elemental Vulnerable, remove the corresponding Vulnerable and further increase the damage by 5% per stack removed."
              }
            },
            'zh-CN': {
              'terms': {
                'mechanic.injury': '负伤',
                'mechanic.tenacity': '韧性',
                'mechanic.afterActionPassive': '行动后被动',
                'mechanic.elementalBurst': '元素爆破'
              },
              'names': {
                'Injury': '负伤',
                'Tenacity': '韧性',
                'After Action Passive': '行动后被动',
                'Elemental Burst': '元素爆破'
              },
              'templates': {
                'injury': '减低自身{percent}%的输出伤害。(叠加上限{max} / 升级后{upgradeMax}。回合结束后失去一半的叠加数)'
              }
            },
            'zh-TW': {
              'terms': {
                'mechanic.injury': '負傷',
                'mechanic.tenacity': '韌性',
                'mechanic.afterActionPassive': '行動後被動',
                'mechanic.elementalBurst': '元素爆破'
              },
              'names': {
                'Injury': '負傷',
                'Tenacity': '韌性',
                'After Action Passive': '行動後被動',
                'Elemental Burst': '元素爆破'
              },
              'templates': {
                'injury': '減低自身{percent}%的輸出傷害。 (疊加上限{max} / 升級後{upgradeMax}。回合結束後失去一半的疊加數)'
              }
            }
          }

          for locale, block in additions.items():
            target = locales.setdefault(locale, {})
            target.setdefault('terms', {}).update(block['terms'])
            target.setdefault('mechanicNames', {}).update(block['names'])
            target.setdefault('templates', {}).update(block['templates'])

          loc_path.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit confirmed mechanics
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json
          git commit -m 'Add confirmed Injury and related mechanics'
          git push
