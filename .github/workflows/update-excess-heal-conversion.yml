name: Update Excess Heal Conversion mechanics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-excess-heal-conversion.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mechanic data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp = Path('data/mechanics.json')
          data = json.loads(mp.read_text())
          defs = data.setdefault('effectDefinitions', {})

          defs['Protective Heal'] = {
            'family': 'Excess Heal Conversion',
            'familyVariant': 'Protective',
            'skillUnit': 'Heal',
            'effect': 'Guard',
            'termKey': 'mechanic.protectiveHeal',
            'localisationKey': 'ProtectiveHealXDescr',
            'mechanicConfirmed': True,
            'confirmationSource': 'live+sheet+localisation',
            'clickable': True,
            'templateKey': 'protectiveHeal',
            'templateArgs': {
              'percent': 'conversionPercentPerStack',
              'maxPercent': 'maxConversionPercent'
            },
            'triggerAt': 'AfterHeal',
            'passiveType': 'AlwaysActive',
            'conversionPercentPerStack': 25,
            'maxStacks': 4,
            'maxConversionPercent': 100,
            'sourceAmount': 'ExcessHeal',
            'conversionTarget': 'SelfProtect',
            'excludesDrainHealing': True
          }

          defs['Offensive Heal'] = {
            'family': 'Excess Heal Conversion',
            'familyVariant': 'Offensive',
            'skillUnit': 'Heal',
            'effect': 'Charge',
            'termKey': 'mechanic.offensiveHeal',
            'localisationKey': 'AggressiveHealXDescr',
            'mechanicConfirmed': True,
            'confirmationSource': 'live+sheet+localisation',
            'clickable': True,
            'templateKey': 'offensiveHeal',
            'templateArgs': {
              'percent': 'conversionPercentPerStack',
              'maxPercent': 'maxConversionPercent'
            },
            'triggerAt': 'AfterHeal',
            'passiveType': 'AlwaysActive',
            'conversionPercentPerStack': 25,
            'maxStacks': 4,
            'maxConversionPercent': 100,
            'sourceAmount': 'ExcessHeal',
            'conversionTarget': 'OpponentDamage',
            'excludesDrainHealing': True
          }

          data['version'] = max(int(data.get('version', 0)), 23)
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lp = Path('data/mechanics_localisation.json')
          loc = json.loads(lp.read_text())
          locales = loc.setdefault('locales', {})
          additions = {
            'en': {
              'terms': {
                'mechanic.protectiveHeal': 'Protective Heal',
                'mechanic.offensiveHeal': 'Offensive Heal'
              },
              'templates': {
                'protectiveHeal': 'For each stack, {percent}% of the excess heal will instead turn into Protect on self. (Max {maxPercent}%. Excludes drain healing)',
                'offensiveHeal': 'For each stack, {percent}% of the excess heal will instead damage the opponent. (Max {maxPercent}%. Excludes drain healing)'
              }
            },
            'zh-CN': {
              'terms': {
                'mechanic.protectiveHeal': '保护型恢复',
                'mechanic.offensiveHeal': '输出型恢复'
              },
              'templates': {
                'protectiveHeal': '每层将{percent}%的过度恢复转换成自身护盾。（上限{maxPercent}%，不包括吸血类的恢复）',
                'offensiveHeal': '每层将{percent}%的过度恢复转换成对敌方的伤害。（上限{maxPercent}%，不包括吸血类的恢复）'
              }
            },
            'zh-TW': {
              'terms': {
                'mechanic.protectiveHeal': '保護型恢復',
                'mechanic.offensiveHeal': '輸出型恢復'
              },
              'templates': {
                'protectiveHeal': '每層將{percent}%的過度恢復轉換成自身護盾。（上限{maxPercent}%，不包括吸血類的恢復）',
                'offensiveHeal': '每層將{percent}%的過度恢復轉換成對敵方的傷害。（上限{maxPercent}%，不包括吸血類的恢復）'
              }
            }
          }
          for locale, payload in additions.items():
              target = locales.setdefault(locale, {})
              target.setdefault('terms', {}).update(payload['terms'])
              target.setdefault('templates', {}).update(payload['templates'])
          loc['version'] = max(int(loc.get('version', 0)), 21)
          lp.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json
          git diff --cached --quiet || git commit -m 'Add confirmed excess heal conversion mechanics'
          git push
