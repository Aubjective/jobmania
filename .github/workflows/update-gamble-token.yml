name: Update Gamble Token mechanic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-gamble-token.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mechanic data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp = Path('data/mechanics.json')
          data = json.loads(mp.read_text())
          defs = data.setdefault('effectDefinitions', {})

          defs['Gamble Token'] = {
            'family': 'Gamble',
            'skillUnit': 'Buff',
            'effect': 'Dice',
            'termKey': 'mechanic.gambleToken',
            'mechanicConfirmed': True,
            'confirmationSource': 'live+sheet',
            'clickable': True,
            'templateKey': 'gambleToken',
            'templateArgs': {
              'doubleThreshold': 'executionThresholds.0.stacks',
              'doubleMultiplier': 'executionThresholds.0.multiplier',
              'tripleThreshold': 'executionThresholds.1.stacks',
              'tripleMultiplier': 'executionThresholds.1.multiplier'
            },
            'executionThresholds': [
              {'stacks': 10, 'multiplier': 2},
              {'stacks': 20, 'multiplier': 3}
            ],
            'appliesToNext': 'GambleSkillExecution',
            'consumedOnActivation': True
          }

          data['version'] = max(int(data.get('version', 0)), 25)
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lp = Path('data/mechanics_localisation.json')
          loc = json.loads(lp.read_text())
          locales = loc.setdefault('locales', {})
          en = locales.setdefault('en', {})
          en.setdefault('terms', {})['mechanic.gambleToken'] = 'Gamble Token'
          en.setdefault('templates', {})['gambleToken'] = "With {doubleThreshold} or more stacks, multiply the next Gamble Skill's execution by {doubleMultiplier}; execution x{tripleMultiplier} if there are {tripleThreshold} stacks. (Consume on activation)"
          loc['version'] = max(int(loc.get('version', 0)), 22)
          lp.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json
          git diff --cached --quiet || git commit -m 'Add confirmed Gamble Token mechanic'
          git push
