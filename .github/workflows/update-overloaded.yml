name: Update Overloaded mechanic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-overloaded.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mechanic data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp = Path('data/mechanics.json')
          data = json.loads(mp.read_text())
          defs = data.setdefault('effectDefinitions', {})
          defs['Overloaded'] = {
            'family': 'Apply Tag',
            'applyTag': True,
            'skillUnit': 'ApplyOn',
            'effect': 'Multiply',
            'termKey': 'mechanic.overloaded',
            'localisationKey': 'Overloaded',
            'mechanicConfirmed': True,
            'confirmationSource': 'live+sheet+localisation',
            'clickable': True,
            'templateKey': 'overloaded',
            'triggerAt': 'OnAction',
            'consumeActionsBasedOn': 'RemainingAP',
            'repeatCountBasedOn': 'RemainingAP',
            'heroAbilityExtraRepeats': 1,
            'enemyMonsterExtraRepeats': 1
          }
          data['version'] = max(int(data.get('version', 0)), 24)
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lp = Path('data/mechanics_localisation.json')
          loc = json.loads(lp.read_text())
          locales = loc.setdefault('locales', {})
          additions = {
            'en': {
              'terms': {'mechanic.overloaded': 'Overloaded'},
              'templates': {'overloaded': "Consume X actions and repeat the ability X times, where X is the user's remaining AP. (As a hero's ability, or when enemy monsters use it, gain extra 1 time(s))"}
            },
            'zh-CN': {'terms': {'mechanic.overloaded': '超载'}},
            'zh-TW': {'terms': {'mechanic.overloaded': '超載'}}
          }
          for locale, payload in additions.items():
              target = locales.setdefault(locale, {})
              target.setdefault('terms', {}).update(payload.get('terms', {}))
              target.setdefault('templates', {}).update(payload.get('templates', {}))
          loc['version'] = max(int(loc.get('version', 0)), 22)
          lp.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json
          git diff --cached --quiet || git commit -m 'Add confirmed Overloaded mechanic'
          git push
