name: Update Sigil families

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sigil-family.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Sigil mechanics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mechanics_path = Path('data/mechanics.json')
          loc_path = Path('data/mechanics_localisation.json')
          mechanics = json.loads(mechanics_path.read_text(encoding='utf-8'))
          mechanics['version'] = max(int(mechanics.get('version', 0)), 21)
          defs = mechanics.setdefault('effectDefinitions', {})

          # Remove the earlier one-off Thunder Sigil definition in favor of family data.
          defs.pop('Thunder Sigil', None)

          mechanics['sigilFamilies'] = {
            'element': {
              'family': 'Element Sigil',
              'skillUnit': 'Mark',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+sheet+localisation',
              'clickable': True,
              'templateKey': 'elementSigil',
              'immunityBypassChancePercentPerStack': 3,
              'damagePercentPerStack': 5,
              'damageBasedOn': 'OpponentStrongestAttribute',
              'maxStacks': 10,
              'upgradeMaxStacks': 10,
              'removedAt': 'TurnEnd',
              'variants': {
                'Fire': {'status': 'Burn'},
                'Water': {'status': 'Chill'},
                'Thunder': {'status': 'Paralysis'},
                'Earth': {'status': 'Seed'},
                'Wind': {'status': 'Dizzy'},
                'Light': {'status': 'Blind'},
                'Dark': {'status': 'Depress'}
              }
            },
            'stat': {
              'family': 'Stat Sigil',
              'skillUnit': 'Mark',
              'mechanicConfirmed': True,
              'confirmationSource': 'sheet+localisation',
              'clickable': True,
              'templateKey': 'statSigil',
              'triggerAt': 'ReceiveMatchingStatDamage',
              'removedOnTrigger': True,
              'variants': {
                'Strength': {'damagePercentPerStack': 20, 'damageBasedOn': 'OpponentStrength'},
                'Agility': {'damagePercentPerStack': 20, 'damageBasedOn': 'OpponentAgility'},
                'Intelligence': {'damagePercentPerStack': 20, 'damageBasedOn': 'OpponentIntelligence'},
                'MaxHP': {'damagePercentPerStack': 2.5, 'upgradeDamagePercentPerStack': 5, 'damageBasedOn': 'OpponentMaxHP'}
              }
            }
          }

          for element, status in {
            'Fire':'Burn','Water':'Chill','Thunder':'Paralysis','Earth':'Seed','Wind':'Dizzy','Light':'Blind','Dark':'Depress'
          }.items():
            defs[f'{element} Sigil'] = {
              'family': 'Element Sigil',
              'skillUnit': 'Mark',
              'effect': element,
              'termKey': f'mechanic.{element.lower()}Sigil',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+sheet+localisation' if element in ('Fire','Thunder') else 'family-confirmed+sheet+localisation',
              'clickable': True,
              'templateKey': 'elementSigil',
              'templateArgs': {'element':'effect','status':'status'},
              'status': status,
              'immunityBypassChancePercentPerStack': 3,
              'damagePercentPerStack': 5,
              'damageBasedOn': 'OpponentStrongestAttribute',
              'maxStacks': 10,
              'upgradeMaxStacks': 10,
              'removedAt': 'TurnEnd'
            }

          for stat, vals in {
            'Strength': (20, None, 'OpponentStrength'),
            'Agility': (20, None, 'OpponentAgility'),
            'Intelligence': (20, None, 'OpponentIntelligence'),
            'MaxHP': (2.5, 5, 'OpponentMaxHP')
          }.items():
            d = {
              'family': 'Stat Sigil',
              'skillUnit': 'Mark',
              'effect': stat,
              'termKey': f'mechanic.{stat.lower()}Sigil',
              'mechanicConfirmed': True,
              'confirmationSource': 'sheet+localisation',
              'clickable': True,
              'templateKey': 'statSigilMaxHP' if stat == 'MaxHP' else 'statSigil',
              'triggerAt': 'ReceiveMatchingStatDamage',
              'damagePercentPerStack': vals[0],
              'damageBasedOn': vals[2],
              'removedOnTrigger': True
            }
            if vals[1] is not None:
              d['upgradeDamagePercentPerStack'] = vals[1]
            defs[f'{stat} Sigil'] = d

          mechanics_path.write_text(json.dumps(mechanics, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          loc = json.loads(loc_path.read_text(encoding='utf-8'))
          loc['version'] = max(int(loc.get('version', 0)), 19)
          locales = loc.setdefault('locales', {})
          en = locales.setdefault('en', {})
          terms = en.setdefault('terms', {})
          names = en.setdefault('mechanicNames', {})
          templates = en.setdefault('templates', {})

          for element in ['Fire','Water','Thunder','Earth','Wind','Light','Dark']:
            terms[f'mechanic.{element.lower()}Sigil'] = f'{element} Sigil'
            names[f'{element} Sigil'] = f'{element} Sigil'
          for stat in ['Strength','Agility','Intelligence','MaxHP']:
            label = 'Max HP Sigil' if stat == 'MaxHP' else f'{stat} Sigil'
            terms[f'mechanic.{stat.lower()}Sigil'] = label
            names[f'{stat} Sigil'] = label

          templates['elementSigil'] = "For each stack, {status} debuffs have a 3% chance to bypass your {status} immunity. Additionally, whenever an ability with the {element} element is used (either from the ability itself or the character's element stack), you suffer 5% damage per sigil stack, based on the opponent's strongest attribute. (Max 10 stacks. Removed at the end of the turn.)"
          templates['statSigil'] = "When receiving matching stat damage, suffer 20% additional damage per Sigil stack based on the opponent's matching stat. Remove the Sigil when triggered."
          templates['statSigilMaxHP'] = "When receiving Max HP damage, suffer 2.5% additional damage per Sigil stack based on the opponent's Max HP, or 5% if upgraded. Remove the Sigil when triggered."

          loc_path.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit Sigil family update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json
          git commit -m 'Add confirmed Element and Stat Sigil families'
          git push
