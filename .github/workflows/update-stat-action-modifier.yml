name: Update Stat Action Modifier family

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stat-action-modifier.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Stat Action Modifier mechanics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mechanics_path = Path('data/mechanics.json')
          loc_path = Path('data/mechanics_localisation.json')

          mechanics = json.loads(mechanics_path.read_text(encoding='utf-8'))
          mechanics['version'] = max(int(mechanics.get('version', 0)), 22)
          families = mechanics.setdefault('mechanicFamilies', {})
          families['statActionModifier'] = {
            'mechanicConfirmed': True,
            'confirmationSource': 'sheet+localisation',
            'stats': ['Strength', 'Agility', 'Intelligence', 'MaxHP'],
            'percentPerStack': 5,
            'affectedValues': ['attack', 'heal', 'protect'],
            'consumedOnActivation': True,
            'endOfTurnPassivesAlsoConsume': True,
            'variants': {
              'buff': {
                'skillUnit': 'InstantBoost',
                'direction': 'increase',
                'maxStacks': 15,
                'upgradeMaxStacks': 20
              },
              'debuff': {
                'skillUnit': 'InstantNerf',
                'direction': 'decrease',
                'maxStacks': 5,
                'upgradeMaxStacks': 10
              }
            }
          }

          defs = mechanics.setdefault('effectDefinitions', {})
          labels = {
            'Strength': 'Strength',
            'Agility': 'Agility',
            'Intelligence': 'Intelligence',
            'MaxHP': 'Max HP'
          }
          slugs = {
            'Strength': 'strength',
            'Agility': 'agility',
            'Intelligence': 'intelligence',
            'MaxHP': 'maxHP'
          }

          for stat in labels:
            label = labels[stat]
            slug = slugs[stat]
            buff_name = f'{label} Action Buff'
            debuff_name = f'{label} Action Debuff'

            defs[buff_name] = {
              'family': 'Stat Action Modifier',
              'familyKey': 'statActionModifier',
              'variant': 'buff',
              'skillUnit': 'InstantBoost',
              'effect': stat,
              'stat': stat,
              'termKey': f'mechanic.{slug}ActionBuff',
              'localisationKey': 'XActBuffDescr',
              'mechanicConfirmed': True,
              'confirmationSource': 'sheet+localisation',
              'clickable': True,
              'templateKey': 'statActionBuff',
              'templateArgs': {
                'stat': 'stat',
                'percent': 'percentPerStack',
                'max': 'maxStacks',
                'upgradeMax': 'upgradeMaxStacks'
              },
              'percentPerStack': 5,
              'maxStacks': 15,
              'upgradeMaxStacks': 20,
              'affectedValues': ['attack', 'heal', 'protect'],
              'consumedOnActivation': True,
              'endOfTurnPassivesAlsoConsume': True
            }

            defs[debuff_name] = {
              'family': 'Stat Action Modifier',
              'familyKey': 'statActionModifier',
              'variant': 'debuff',
              'skillUnit': 'InstantNerf',
              'effect': stat,
              'stat': stat,
              'termKey': f'mechanic.{slug}ActionDebuff',
              'localisationKey': 'XActDebuffDescr',
              'mechanicConfirmed': True,
              'confirmationSource': 'sheet+localisation',
              'clickable': True,
              'templateKey': 'statActionDebuff',
              'templateArgs': {
                'stat': 'stat',
                'percent': 'percentPerStack',
                'max': 'maxStacks',
                'upgradeMax': 'upgradeMaxStacks'
              },
              'percentPerStack': 5,
              'maxStacks': 5,
              'upgradeMaxStacks': 10,
              'affectedValues': ['attack', 'heal', 'protect'],
              'consumedOnActivation': True,
              'endOfTurnPassivesAlsoConsume': True
            }

          mechanics_path.write_text(json.dumps(mechanics, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          loc = json.loads(loc_path.read_text(encoding='utf-8'))
          loc['version'] = max(int(loc.get('version', 0)), 20)
          locales = loc.setdefault('locales', {})

          terms = {
            'en': {
              'Strength': 'Strength', 'Agility': 'Agility', 'Intelligence': 'Intelligence', 'MaxHP': 'Max HP',
              'suffixBuff': 'Action Buff', 'suffixDebuff': 'Action Debuff'
            },
            'zh-CN': {
              'Strength': '力量', 'Agility': '敏捷', 'Intelligence': '智力', 'MaxHP': 'Max HP',
              'suffixBuff': '微增益', 'suffixDebuff': '微减益'
            },
            'zh-TW': {
              'Strength': '力量', 'Agility': '敏捷', 'Intelligence': '智力', 'MaxHP': 'Max HP',
              'suffixBuff': '微增益', 'suffixDebuff': '微減益'
            }
          }

          templates = {
            'en': {
              'statActionBuff': "Buff one action's {stat} attack, heal and Protect by {percent}% for each stack. (Max {max}/upgrade {upgradeMax} stacks. Consumed on activation, [End-Of-Turn] passives will also consume this buff)",
              'statActionDebuff': "Debuff one action's {stat} attack, heal and Protect by {percent}% for each stack. (Max {max}/upgrade {upgradeMax} stacks. Consumed on activation, [End-Of-Turn] passives will also consume this debuff)"
            },
            'zh-CN': {
              'statActionBuff': '每层增强一个行动的{stat}攻击、恢复和护甲获得量{percent}%。(叠加上限{max}/升级后{upgradeMax}。发动后消耗，【回合结束】被动技能也会消耗此增益)',
              'statActionDebuff': '每层降低一个行动的{stat}攻击、恢复和护甲获得量{percent}%。(叠加上限{max}/升级后{upgradeMax}。发动后消耗，【回合结束】被动技能也会消耗此减益)'
            },
            'zh-TW': {
              'statActionBuff': '每層增強一個行動的{stat}攻擊、恢復和護甲獲得量{percent}%。(疊加上限{max}/升級後{upgradeMax}。發動後消耗，【回合結束】被動技能也會消耗此增益)',
              'statActionDebuff': '每層降低一個行動的{stat}攻擊、恢復和護甲獲得量{percent}%。(疊加上限{max}/升級後{upgradeMax}。發動後消耗，【回合結束】被動技能也會消耗此減益)'
            }
          }

          for locale in ['en', 'zh-CN', 'zh-TW']:
            block = locales.setdefault(locale, {})
            term_block = block.setdefault('terms', {})
            name_block = block.setdefault('mechanicNames', {})
            template_block = block.setdefault('templates', {})
            for stat in labels:
              slug = slugs[stat]
              loc_stat = terms[locale][stat]
              buff_name = f'{labels[stat]} Action Buff'
              debuff_name = f'{labels[stat]} Action Debuff'
              buff_label = f"{loc_stat} {terms[locale]['suffixBuff']}" if locale == 'en' else f"{loc_stat}{terms[locale]['suffixBuff']}"
              debuff_label = f"{loc_stat} {terms[locale]['suffixDebuff']}" if locale == 'en' else f"{loc_stat}{terms[locale]['suffixDebuff']}"
              term_block[f'mechanic.{slug}ActionBuff'] = buff_label
              term_block[f'mechanic.{slug}ActionDebuff'] = debuff_label
              name_block[buff_name] = buff_label
              name_block[debuff_name] = debuff_label
            template_block.update(templates[locale])

          loc_path.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit Stat Action Modifier family
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json
          git commit -m 'Unify Stat Action Buff and Debuff family'
          git push
