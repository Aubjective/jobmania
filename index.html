<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobmania Wiki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav id="main-nav">
            <img src="jobmania_official_icon.png" alt="Jobmania Logo" class="nav-logo">

            <select id="langSelect" onchange="window.location.href=this.value">
                <option value="index.html" selected>🇬🇧 English</option>
                <option value="zh-cn.html">🇨🇳 中文（简体）</option>
                <option value="zh-tw.html">🇹🇼 中文（繁體）</option>
            </select>

            <div class="game-info">
                <strong>Jobmania - Eternal Dungeon</strong><br>
                AUBJECTIVE TECHNOLOGY LTD.<br>
                Contains ads • In-app purchases
            </div>
            <hr>
            <div class="menu-item" onclick="loadView('Home')">🏠 Home</div>
            <div class="menu-item" onclick="loadView('Monsters')">👹 Characters</div>
            <div class="menu-item" onclick="loadView('Jobs')">⚔️ Jobs</div>
            <div class="menu-item" onclick="loadView('Abilities')">✨ Abilities</div>
            <div class="menu-item" onclick="loadView('Passives')">🛡️ Passives</div>
            <div class="menu-item" onclick="loadView('Materials')">🧱 Materials</div>
            <div class="menu-item" onclick="loadView('Relic')">💍 Relic System</div>
            <hr>
            <a href="https://play.google.com/store/apps/details?id=com.aubjective.jobmania&hl=en" target="_blank" class="menu-link">▶️ Google Play</a>
            <a href="https://discord.gg/6U5FNFVrwb" target="_blank" class="menu-link">💬 Join Discord</a>
        </nav>
        <main id="content"><h1>Loading Wiki Data...</h1></main>
    </div>
    <script>window.JOBMANIA_LOCALE = 'en'; window.JOBMANIA_DEFER_INIT = true;</script>
    <script src="performance-preload.js"></script>
    <script src="script.js"></script>
    <script src="wiki-localisation.js"></script>
    <script src="job-media.js"></script>
    <script src="skill-description-wiki.js"></script>
    <script src="hash-routing.js"></script>
    <script>init();</script>
</body>
</html>
